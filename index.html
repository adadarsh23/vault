<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://unpkg.com https://cdn.jsdelivr.net https://www.googletagmanager.com https://cdn.logr-in.com https://www.google.com https://*.google.com https://www.gstatic.com https://www.recaptcha.net https://recaptcha.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' blob: data: https:; media-src 'self' blob: data: https:; connect-src 'self' * blob: data: https://unpkg.com https://cdn.jsdelivr.net https://www.google.com https://*.google.com https://www.gstatic.com https://www.recaptcha.net https://recaptcha.google.com; worker-src 'self' blob: https://unpkg.com https://cdn.jsdelivr.net; child-src 'self' blob: https://unpkg.com https://cdn.jsdelivr.net https://www.google.com https://*.google.com https://recaptcha.google.com https://www.recaptcha.net; frame-src 'self' blob: data: https://view.officeapps.live.com https://www.google.com https://*.google.com https://*.google.co.in https://recaptcha.google.com https://www.recaptcha.net https://www.gstatic.com https://www.openstreetmap.org; object-src 'self' blob:;"
    />
    <title>Vault - Secure Storage</title>
    <meta name="color-scheme" content="dark light" />

    <meta
      name="description"
      content="Securely store your files, notes, and sensitive data with end-to-end peace of mind."
    />
    <meta
      name="keywords"
      content="vault, secure storage, end-to-end encryption, private notes, encrypted files"
    />
    <meta name="author" content="Vault Team" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Vault" />
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />

    <!-- Search Engine -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <link rel="canonical" href="%VITE_APP_PUBLIC_URL%" />

    <!-- Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Performance & DNS -->
    <link rel="dns-prefetch" href="%VITE_DNS_PREFETCH_HOST%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="%VITE_APP_PUBLIC_URL%" crossorigin />

    <!-- Icons & PWA -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#000000" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Vault" />

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="/web-app-manifest-192x192.png" />
    <meta name="msapplication-config" content="none" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_APP_PUBLIC_URL%" />
    <meta property="og:title" content="Vault - Secure Storage" />
    <meta
      property="og:description"
      content="Securely store your files, notes, and sensitive data with end-to-end peace of mind."
    />
    <meta property="og:image" content="%VITE_APP_PUBLIC_URL%/web-app-manifest-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Vault - Secure Storage" />
    <meta property="og:site_name" content="Vault" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%VITE_APP_PUBLIC_URL%" />
    <meta name="twitter:title" content="Vault - Secure Storage" />
    <meta
      name="twitter:description"
      content="Secure personal vault for storing files, notes, and sensitive data safely."
    />
    <meta name="twitter:image" content="%VITE_APP_PUBLIC_URL%/web-app-manifest-512x512.png" />
    <meta name="twitter:image:alt" content="Vault - Secure Storage" />

    <!-- iOS/PWA Specifics -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- <meta name="HandheldFriendly" content="True" />
  <meta name="MobileOptimized" content="320" /> -->

    <!-- Splash Screens (iOS) -->
    <link rel="apple-touch-startup-image" href="/web-app-manifest-512x512.png" />
    <link rel="fluid-icon" href="/favicon.svg" title="Vault" />
  </head>

  <body>
    <!-- No JS fallback -->
    <noscript>
      <strong>This app requires JavaScript to run properly.</strong>
    </noscript>

    <main>
      <!-- React Root -->
      <div id="root">
        <div
          role="status"
          aria-live="polite"
          aria-busy="true"
          style="
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px;
            font-family:
              system-ui,
              -apple-system,
              'Segoe UI',
              Roboto,
              sans-serif;
            background: #0b0b0b;
            color: rgba(255, 255, 255, 0.75);
            text-align: center;
            overflow: hidden;
          "
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            style="
              width: 40px;
              height: 40px;
              opacity: 0.55;
              animation: vault-root-spin 0.9s linear infinite;
            "
          >
            <path
              d="M21 12a9 9 0 1 1-6.219-8.56"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <p
            style="
              margin: 0;
              font-size: 14px;
              font-weight: 500;
              opacity: 0.8;
              animation: vault-root-pulse 1.2s ease-in-out infinite;
            "
          >
            Loading Vault...
          </p>
        </div>
      </div>
    </main>
    <div id="theme-transition-overlay"></div>

    <style>
      @keyframes vault-root-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes vault-root-pulse {
        0%,
        100% {
          opacity: 0.45;
        }

        50% {
          opacity: 0.9;
        }
      }
    </style>

    <script src="/vite-preload-shim.js"></script>

    <!-- Main App -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
