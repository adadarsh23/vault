version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 10
    target-branch: 'main'
    labels:
      - 'dependencies'
      - 'automated-pr'
    groups:
      dev-dependencies:
        patterns:
          - '@types/*'
          - '@vitest/*'
          - 'prettier'
          - 'eslint*'
          - 'typescript'
          - 'vite*'
        update-types:
          - 'minor'
          - 'patch'

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    labels:
      - 'github-actions'
      - 'automated-pr'
