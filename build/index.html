  <body>
    <!-- No JS fallback -->
    <noscript>
      <strong>This app requires JavaScript to run properly.</strong>
    </noscript>

    <main>
      <!-- React Root -->
      <div id="root">
        <div
          role="status"
          aria-live="polite"
          aria-busy="true"
          style="
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 16px;
            font-family:
              system-ui,
              -apple-system,
              'Segoe UI',
              Roboto,
              sans-serif;
            background: #0b0b0b;
            color: rgba(255, 255, 255, 0.75);
            text-align: center;
            overflow: hidden;
          "
        >
          <svg
            aria-hidden="true"
            viewBox="0 0 24 24"
            style="
              width: 40px;
              height: 40px;
              opacity: 0.55;
              animation: vault-root-spin 0.9s linear infinite;
            "
          >
            <path
              d="M21 12a9 9 0 1 1-6.219-8.56"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
          <p
            style="
              margin: 0;
              font-size: 14px;
              font-weight: 500;
              opacity: 0.8;
              animation: vault-root-pulse 1.2s ease-in-out infinite;
            "
          >
            Loading Vault...
          </p>
        </div>
      </div>
    </main>
    <div id="theme-transition-overlay"></div>

    <style>
      @keyframes vault-root-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes vault-root-pulse {
        0%,
        100% {
          opacity: 0.45;
        }

        50% {
          opacity: 0.9;
        }
      }
    </style>

    <script src="/vite-preload-shim.js"></script>

    <!-- Main App -->
  </body>
