<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <title>Vault | Service Busy</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />

    <style>
      :root {
        color-scheme: light dark;

        --bg: #ffffff;
        --text: #1a1a1a;
        --muted: rgba(26, 26, 26, 0.68);
        --card-border: rgba(0, 0, 0, 0.1);
        --code-bg: rgba(0, 0, 0, 0.06);
        --button-bg: #1a1a1a;
        --button-text: #ffffff;
        --radius: 0.625rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0b;
          --text: rgba(255, 255, 255, 0.75);
          --muted: rgba(255, 255, 255, 0.5);
          --card-border: rgba(255, 255, 255, 0.1);
          --code-bg: rgba(255, 255, 255, 0.08);
          --button-bg: #ffffff;
          --button-text: #111111;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;

        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;

        background: var(--bg);
        color: var(--text);
        text-align: center;
      }

      main {
        width: 100%;
        max-width: 400px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      svg {
        width: 40px;
        height: 40px;
        margin-bottom: 8px;
        opacity: 0.55;
      }

      h1 {
        margin: 0;

        font-size: 1.25rem;
        font-weight: 500;
        letter-spacing: -0.02em;

        color: var(--text);
      }

      p {
        margin: 0;

        font-size: 0.95rem;
        line-height: 1.5;

        color: var(--muted);
      }

      .actions {
        width: 100%;

        display: flex;
        flex-direction: column;
        gap: 8px;

        margin-top: 16px;
      }

      .btn {
        width: 100%;

        appearance: none;
        border: 1px solid transparent;
        border-radius: var(--radius);

        padding: 10px 16px;

        font: inherit;
        font-size: 0.92rem;
        font-weight: 500;
        line-height: 1.4;

        text-decoration: none;
        text-align: center;

        cursor: pointer;

        background: var(--button-bg);
        color: var(--button-text);

        display: inline-block;

        transition:
          opacity 0.2s ease,
          background-color 0.2s ease;
      }

      .btn:hover {
        opacity: 0.9;
      }

      .btn:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }

      .btn:disabled,
      .btn[aria-disabled='true'] {
        opacity: 0.55;
        cursor: not-allowed;
        pointer-events: none;
      }

      .btn.secondary {
        background: transparent;
        color: var(--text);
        border-color: var(--card-border);
      }

      .btn.secondary:hover {
        background: var(--code-bg);
      }
    </style>
  </head>

  <body>
    <main>
      <svg
        fill="none"
        stroke="currentColor"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.5"
        viewBox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
        <path d="M12 9v4" />
        <path d="M12 17h.01" />
      </svg>

      <h1>Service temporarily busy</h1>

      <p>
        The server is under heavy load and cannot process this request right now. Please wait a few
        seconds, then refresh.
      </p>

      <div class="actions">
        <button class="btn" id="refreshBtn" type="button">Refresh</button>

        <a class="btn secondary" href="/health"> Check Status (/health) </a>
      </div>
    </main>

    <script src="/service-busy.js" defer></script>
  </body>
</html>
