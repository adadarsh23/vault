name: '💡 Feature Request'
description: 'Suggest an idea, enhancement, or new feature for Vault'
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea to make Vault better!
        Please review the [Roadmap / README](https://github.com/adadarsh23/vault#roadmap) to ensure the concept isn't already planned.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe it clearly.
      placeholder: 'I am always frustrated when...'
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe what you would like to see happen and how it fits into Vault.
      placeholder: 'A clear and concise description of what you want to happen...'
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you considered.
      placeholder: 'I also considered...'
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - 'Encryption & Cryptography (Zero-Knowledge)'
        - 'Authentication & Security (2FA, Sessions)'
        - 'Vault Media & Storage (Photos, Videos, Uploads)'
        - 'Notes & Editor (Rich Text, Markdown)'
        - 'Passwords & Credentials Manager'
        - 'UI / UX & Accessibility'
        - 'DevOps / Docker / Deployment'
        - 'Other'
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context or Mockups
      description: Add any other context, screenshots, or architectural diagrams here.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: 'I am willing to submit a pull request implementing this feature if approved.'
          required: false
