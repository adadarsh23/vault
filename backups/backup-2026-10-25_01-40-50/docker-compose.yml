services:
  mongodb:
    image: mongo:8.0
    container_name: vault-mongodb

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-vault_secure_password_123}

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '--username',
          '$$MONGO_INITDB_ROOT_USERNAME',
          '--password',
          '$$MONGO_INITDB_ROOT_PASSWORD',
          '--authenticationDatabase',
          'admin',
          '--eval',
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vault-app
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}

      # 🔒 Strict MONGODB_URI (Aborts startup if missing)
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}

      # 🔒 Strict Cryptographic Secrets
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:?VAULT_ENCRYPTION_KEY is required}
      AUTH_PEPPER: ${AUTH_PEPPER:?AUTH_PEPPER is required}
      CSRF_SECRET: ${CSRF_SECRET:-}
      SIGNED_URL_SECRET: ${SIGNED_URL_SECRET:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4000}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      VITE_APP_PUBLIC_URL: ${VITE_APP_PUBLIC_URL:-http://localhost:4000}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongodb_data:
