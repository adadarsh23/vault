<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vault | Service Busy</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --text: #1a1a1a;
      --muted: rgba(26, 26, 26, 0.68);
      --card: rgba(0, 0, 0, 0.03);
      --card-border: rgba(0, 0, 0, 0.1);
      --chip-bg: rgba(0, 0, 0, 0.03);
      --chip-border: rgba(0, 0, 0, 0.14);
      --code-bg: rgba(0, 0, 0, 0.06);
      --button-bg: #1a1a1a;
      --button-text: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.74);
        --card: rgba(255, 255, 255, 0.05);
        --card-border: rgba(255, 255, 255, 0.1);
        --chip-bg: rgba(255, 255, 255, 0.06);
        --chip-border: rgba(255, 255, 255, 0.14);
        --code-bg: rgba(255, 255, 255, 0.08);
        --button-bg: #ffffff;
        --button-text: #111111;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Geist Variable", "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(127, 127, 127, 0.18), transparent 45%),
        radial-gradient(circle at 80% 0%, rgba(127, 127, 127, 0.12), transparent 40%),
        var(--bg);
      color: var(--text);
      padding: 16px;
    }

    main {
      width: min(760px, 100%);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 14px 0 8px 0;
      font-size: clamp(1.55rem, 7vw, 2.6rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0.45rem 0;
      line-height: 1.5;
      color: var(--muted);
      font-size: clamp(0.95rem, 2.8vw, 1.05rem);
    }

    code {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.15rem 0.45rem;
      color: var(--text);
      font-weight: 600;
    }

    .actions {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--card-border);
      background: var(--button-bg);
      color: var(--button-text);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn.secondary {
      background: transparent;
      color: var(--text);
    }

    @media (max-width: 640px) {
      main {
        padding: 18px;
        border-radius: 16px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Service temporarily busy</h1>
    <p>The server is under heavy load and cannot process this request right now.</p>
    <p>Please wait a few seconds, then refresh.</p>
    <p>If this keeps happening, check <code>/health</code> and your runtime logs.</p>
    <div class="actions">
      <button class="btn" type="button" onclick="window.location.reload()">Refresh</button>
      <button class="btn secondary" type="button" onclick="window.location.href='/health'">Open /health</button>
    </div>
  </main>
</body>

</html>
